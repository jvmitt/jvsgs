[package]
name = "jvsgs"
description = "JVS Ground Station is a UAV GCS made for portability and reliable operation."
keywords = ["arm", "cortex-m"]
categories = ["embedded", "no-std"]
authors = ["jvmitt"]
license = ""
edition = "2021"
version = "0.0.1"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
defmt = { version = "1.0.1", features = ["encoding-rzcobs"] }
defmt-brtt = { version = "0.1", default-features = false, features = ["rtt"] }
flip-link = "0.1.12"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
probe-rs = { version = "0.31.0", optional = true }
rtic = { version = "2.1.1", features = [ "thumbv7-backend" ] }
stm32f4xx-hal = { version = "0.23.0", features = ["stm32f411"] }
rtic-monotonics = { version = "2.1.0", features = [ "cortex-m-systick" ]}
defmt-rtt = "1.2.0"

# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true # <-
incremental = false
opt-level = "s" # <-
overflow-checks = true # <-

# cargo test
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true # <-
incremental = false
opt-level = "s" # <-
overflow-checks = true # <-

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false # <-
incremental = false
lto = 'fat'
opt-level = "s" # <-
overflow-checks = false # <-

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false # <-
incremental = false
lto = 'fat'
opt-level = "s" # <-
overflow-checks = false # <-

[features]
probe-rs = ["dep:probe-rs"]

